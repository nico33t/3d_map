<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Mappa 3D GPS Italia</title>
  </head>
  <body>
    <main id="map" aria-label="Mappa 3D dei mezzi"></main>
    <aside id="panel" aria-label="Mezzi">
      <header>
        <h1>Mappa 3D</h1>
        <a id="logout" href="/logout">Esci</a>
      </header>
      <p id="summary" role="status">Caricamento dei mezzi…</p>
      <div class="segmented" role="group" aria-label="Tipo di mappa">
        <button id="standard" type="button" aria-pressed="true">Standard 3D</button>
        <button id="hybrid" type="button" aria-pressed="false">Satellite 3D</button>
      </div>
      <input id="search" type="search" placeholder="Cerca per nome o targa" autocomplete="off" aria-label="Cerca un mezzo">
      <ul id="list"></ul>
      <section id="selected" hidden>
        <h2 id="selected-name"></h2>
        <p id="selected-detail"></p>
        <div class="row">
          <button id="follow" type="button" aria-pressed="true">Segui il mezzo</button>
          <button id="deselect" type="button">Chiudi</button>
        </div>
        <button id="replay-open" type="button">Timelapse del percorso</button>
      </section>
      <section id="replay" hidden aria-label="Timelapse">
        <h2>Timelapse</h2>
        <label class="muted" for="replay-day">Giorno</label>
        <input id="replay-day" type="date">
        <p id="replay-state" class="muted" role="status"></p>
        <input id="replay-time" type="range" min="0" max="1000" value="0" step="1" aria-label="Momento del percorso" disabled>
        <p id="replay-clock" class="clock"></p>
        <div class="row">
          <button id="replay-play" type="button" disabled>Riproduci</button>
          <select id="replay-speed" aria-label="Velocità">
            <option value="60">1 minuto al secondo</option>
            <option value="300" selected>5 minuti al secondo</option>
            <option value="900">15 minuti al secondo</option>
            <option value="3600">1 ora al secondo</option>
          </select>
        </div>
        <button id="video-open" type="button" hidden>Esporta come video</button>
        <button id="replay-close" type="button">Torna alla diretta</button>
      </section>
      <p id="updated" class="muted"></p>
    </aside>
    <p id="error" role="alert" hidden></p>
    <dialog id="idle-dialog" aria-labelledby="idle-title">
      <h2 id="idle-title">Sei ancora qui?</h2>
      <p id="idle-text">Per non consumare la mappa 3D senza nessuno davanti, tra 60 secondi torni all’app GPS Italia.</p>
      <button id="idle-stay" type="button">Sì, continuo</button>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
