<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Mappa 3D GPS Italia</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 420px; padding: 24px; text-align: center; }
      p { color: #555; }
      a { color: inherit; }
      @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } p { color: #aaa; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Mappa 3D GPS Italia</h1>
      <p id="who">Accesso verificato.</p>
      <p>La mappa con i mezzi in diretta e il timelapse arriva nelle prossime versioni.</p>
      <p><a href="/logout">Esci</a></p>
    </main>
    <script type="module">
      fetch('/api/session', { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(body => { if (body?.data?.name) document.getElementById('who').textContent = `Accesso verificato: ${body.data.name}.`; })
        .catch(() => {});
    </script>
  </body>
</html>
